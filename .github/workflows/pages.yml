name: Deploy browser solver to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "wasm/**"
      - "src/**"
      - "third_party/HiGHS/**"
      - "third_party/spdlog/**"
      - "third_party/omsim/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
      - name: Configure WebAssembly target
        run: emcmake cmake -S wasm -B build-wasm -DCMAKE_BUILD_TYPE=Release
      - name: Build WebAssembly module
        run: emmake cmake --build build-wasm --parallel 2
      - name: Smoke-test the module
        run: |
          node --check web/app.js
          node --check web/i18n.js
          node --check web/layout.js
          node --check web/puzzle-builder.js
          node web/smoke-test.cjs build-wasm/opusoptima.js asset/puzzle/easy/just-salt.puzzle
          node web/editor-smoke.cjs build-wasm/opusoptima.js
          node web/json-smoke.cjs build-wasm/opusoptima.js
          node web/layout-smoke.cjs
      - name: Assemble static site
        run: |
          mkdir -p web/dist
          cp web/index.html web/app.js web/i18n.js web/layout.js web/puzzle-builder.js web/style.css web/dist/
          cp build-wasm/opusoptima.js build-wasm/opusoptima.wasm web/dist/
          touch web/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
